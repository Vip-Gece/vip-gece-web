# VIP GECE geçici erişim kapatma (SEO-güvenli 503 + Retry-After)
# Public site kapatılırken bu dosya `/etc/nginx/snippets/vip-gece-closed.conf`
# olarak kurulur ve `vip-gece-ssl.conf` içindeki `vip-gece-route.conf`
# include'undan önce çağrılır.
#
# Kapat: touch /var/www/vip-gece-site/CLOSED   (nginx reload gerekmez)
# Aç:    rm -f /var/www/vip-gece-site/CLOSED   (nginx reload gerekmez)
# Toggle: vip-gece-access close|open|status

if (-f /var/www/vip-gece-site/CLOSED) {
    return 503;
}

error_page 503 @vip_gece_closed;

location @vip_gece_closed {
    default_type text/plain;
    add_header Retry-After 86400 always;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    return 503 "Service temporarily unavailable\n";
}
