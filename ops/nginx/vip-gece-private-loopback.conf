# VIP GECE management listener. This socket is reachable only on the VPS
# loopback interface and is intended to be used through an SSH port forward:
#   ssh -L 8443:127.0.0.1:8443 vip-gece-vps
#   http://127.0.0.1:8443/vg-panel-91x
#
# Replace the placeholder during deployment. Never commit the production value.
map $http_upgrade $vip_gece_private_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 127.0.0.1:8443;
    server_name 127.0.0.1 localhost;

    access_log /var/log/nginx/vip-gece-private-loopback.access.log;
    error_log /var/log/nginx/vip-gece-private-loopback.error.log;
    client_max_body_size 16m;

    allow 127.0.0.1;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header X-Real-IP 127.0.0.1;
        proxy_set_header X-Forwarded-For 127.0.0.1;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host 127.0.0.1;
        proxy_set_header X-Forwarded-Port 8443;
        proxy_set_header X-Vip-Gece-Private-Panel-Secret "__VIP_GECE_PRIVATE_PANEL_SECRET__";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vip_gece_private_connection_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        proxy_hide_header X-Powered-By;
    }

    add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
}
