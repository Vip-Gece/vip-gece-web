## vip-gece.com is a blocked legacy host, not a migration source.
## Do not redirect this domain to vip-gece.site; the .site migration was cancelled.

server {
    listen 80;
    listen [::]:80;
    server_name vip-gece.com www.vip-gece.com;

    access_log /var/log/nginx/vip-gece.com.access.log;
    error_log /var/log/nginx/vip-gece.com.error.log warn;

    real_ip_header X-Vip-Gece-Origin-Peer;
    real_ip_recursive off;
    include /etc/nginx/snippets/vip-gece-cloudflare-only.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
        try_files $uri =404;
    }

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location / {
        return 410;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vip-gece.com www.vip-gece.com;

    ssl_certificate /etc/letsencrypt/live/vip-gece.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vip-gece.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/vip-gece.com.access.log;
    error_log /var/log/nginx/vip-gece.com.error.log warn;

    real_ip_header X-Vip-Gece-Origin-Peer;
    real_ip_recursive off;
    include /etc/nginx/snippets/vip-gece-cloudflare-only.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
        try_files $uri =404;
    }

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        return 410;
    }
}
