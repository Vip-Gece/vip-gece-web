server {
    listen 80;
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/vip-gece.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vip-gece.com/privkey.pem;

    return 444;
}

server {
    server_name vip-gece.com www.vip-gece.com;

    real_ip_header X-Vip-Gece-Origin-Peer;
    real_ip_recursive off;
    include /etc/nginx/snippets/vip-gece-cloudflare-only.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
        try_files $uri =404;
    }

    location / {
        return 301 https://vip-gece.site$request_uri;
    }

    listen 443 ssl;
    http2 on;
    ssl_certificate /etc/letsencrypt/live/vip-gece.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vip-gece.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name vip-gece.com www.vip-gece.com;

    real_ip_header X-Vip-Gece-Origin-Peer;
    real_ip_recursive off;
    include /etc/nginx/snippets/vip-gece-cloudflare-only.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
        try_files $uri =404;
    }

    location / {
        return 301 https://vip-gece.site$request_uri;
    }
}
