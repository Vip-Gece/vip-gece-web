map $http_upgrade $vip_gece_connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name vip-gece.site www.vip-gece.site;

    include /etc/nginx/snippets/vip-gece-cloudflare-only.conf;
    return 301 https://vip-gece.site$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name preview.vip-gece.site;

    include /etc/nginx/snippets/vip-gece-cloudflare-only.conf;
    return 301 https://preview.vip-gece.site$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vip-gece.site www.vip-gece.site;

    ssl_certificate /etc/nginx/ssl/vip-gece.pem;
    ssl_certificate_key /etc/nginx/ssl/vip-gece.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:VIPGECE:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/vip-gece.site.access.log;
    error_log /var/log/nginx/vip-gece.site.error.log warn;

    include /etc/nginx/snippets/vip-gece-cloudflare-only.conf;

    client_max_body_size 16m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;

    if ($host = www.vip-gece.site) {
        return 301 https://vip-gece.site$request_uri;
    }

    include /etc/nginx/snippets/vip-gece-route.conf;

    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name preview.vip-gece.site;

    ssl_certificate /etc/nginx/ssl/vip-gece.pem;
    ssl_certificate_key /etc/nginx/ssl/vip-gece.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:VIPGECE:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/preview.vip-gece.site.access.log;
    error_log /var/log/nginx/preview.vip-gece.site.error.log warn;

    include /etc/nginx/snippets/vip-gece-cloudflare-only.conf;

    client_max_body_size 16m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host vip-gece.site;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host preview.vip-gece.site;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vip_gece_connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Cache-Control;
        proxy_hide_header CDN-Cache-Control;
        proxy_hide_header Cloudflare-CDN-Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "private, no-store, max-age=0" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name panel.vip-gece.site;

    ssl_certificate /etc/nginx/ssl/vip-gece.pem;
    ssl_certificate_key /etc/nginx/ssl/vip-gece.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:VIPGECE:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/panel.vip-gece.site.access.log;
    error_log /var/log/nginx/panel.vip-gece.site.error.log warn;

    include /etc/nginx/snippets/vip-gece-cloudflare-only.conf;

    client_max_body_size 16m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vip_gece_connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Cache-Control;
        proxy_hide_header CDN-Cache-Control;
        proxy_hide_header Cloudflare-CDN-Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "private, no-store, max-age=0" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
}
