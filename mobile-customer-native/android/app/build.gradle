plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
}

def releaseSigningPropertiesFile = file("${System.properties['user.home']}/.codex/.secrets/vip-gece-customer-release.properties")
def releaseSigningProperties = new Properties()
def customerApplicationId = (project.findProperty("vipCustomerApplicationId") ?: "com.vipgece.customer").toString()
def customerVersionCode = (project.findProperty("vipCustomerVersionCode") ?: "1").toString().toInteger()
def customerVersionName = (project.findProperty("vipCustomerVersionName") ?: "1.0.0").toString()
def customerOrigin = (project.findProperty("vipCustomerOrigin") ?: "https://vip-gece.site").toString()
def customerAppName = (project.findProperty("vipCustomerAppName") ?: "VIP Gece Müşteri").toString()
def customerLauncherIcon = (project.findProperty("vipCustomerLauncherIcon") ?: "@drawable/vip_gece_launcher_site").toString()
def customerBrandVariant = (project.findProperty("vipCustomerBrandVariant") ?: "site").toString()
if (!(customerApplicationId ==~ /[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+/)) {
    throw new GradleException("vipCustomerApplicationId must be a valid Android application ID.")
}
if (!(customerOrigin ==~ /https:\/\/[a-zA-Z0-9.-]+/)) {
    throw new GradleException("vipCustomerOrigin must be a bare HTTPS origin.")
}
if (!(customerLauncherIcon ==~ /@drawable\/[a-z0-9_]+/)) {
    throw new GradleException("vipCustomerLauncherIcon must be a drawable resource reference.")
}
if (!(customerBrandVariant ==~ /[a-z0-9_-]+/)) {
    throw new GradleException("vipCustomerBrandVariant must be a lowercase build label.")
}
if (releaseSigningPropertiesFile.exists()) {
    releaseSigningProperties.load(new FileInputStream(releaseSigningPropertiesFile))
}

android {
    namespace "com.vipgece.customer"
    compileSdk 36

    defaultConfig {
        applicationId customerApplicationId
        minSdk 26
        targetSdk 36
        versionCode customerVersionCode
        versionName customerVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "BUILT_IN_ORIGIN", "\"${customerOrigin}\""
        buildConfigField "String", "BRAND_VARIANT", "\"${customerBrandVariant}\""
        manifestPlaceholders = [
                vipCustomerAppLabel: customerAppName,
                vipCustomerLauncherIcon: customerLauncherIcon
        ]
    }

    signingConfigs {
        release {
            if (releaseSigningPropertiesFile.exists()) {
                storeFile file(releaseSigningProperties["storeFile"])
                storePassword releaseSigningProperties["storePassword"]
                keyAlias releaseSigningProperties["keyAlias"]
                keyPassword releaseSigningProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        debug {
            versionNameSuffix "-debug"
            buildConfigField "boolean", "MULTI_PROFILE_DEMO_AVAILABLE", "true"
        }
        release {
            buildConfigField "boolean", "MULTI_PROFILE_DEMO_AVAILABLE", "false"
            if (releaseSigningPropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.work:work-runtime:2.11.2"
    implementation "androidx.core:core:1.17.0"
    implementation "androidx.exifinterface:exifinterface:1.4.2"
    implementation "com.google.firebase:firebase-messaging:24.1.2"
    testImplementation "junit:junit:4.13.2"
}
